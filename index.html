<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiario WebAR - Quimera</title>
    
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: quimera.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: false"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">

        <!-- El video ahora vive aquí, precargado pero SIN autoplay -->
        <a-assets>
            <video id="quimeraVideo" 
                   src="quimera-video.mp4" 
                   preload="auto" 
                   loop 
                   muted 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="quimeraTarget" mindar-image-target="targetIndex: 0">
            <a-video src="#quimeraVideo" 
                     position="0 0 0" 
                     scale="1 1 1">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const videoEl = document.querySelector('#quimeraVideo');
        const targetEntity = document.querySelector('#quimeraTarget');

        targetEntity.addEventListener('targetFound', () => {
            videoEl.currentTime = 0;
            videoEl.muted = false;
            videoEl.play();
        });

        targetEntity.addEventListener('targetLost', () => {
            videoEl.pause();
        });
    </script>
</body>
</html>
